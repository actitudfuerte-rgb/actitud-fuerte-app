name: Compilar APK de Android

on:
  push:
    branches: [ "main", "principal" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código del repositorio
      uses: actions/checkout@v4

    - name: Configurar Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configurar Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Compilar APK con Gradle
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'DUMMY_KEY' }}
      run: gradle assembleDebug --stacktrace

    - name: Guardar y subir el archivo APK resultante
      uses: actions/upload-artifact@v4
      with:
        name: ActitudFuerte-APK
        path: app/build/outputs/apk/debug/app-debug.apk
